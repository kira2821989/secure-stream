<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Zingra ⚡ 1-on-1 Video & E2EE Chat</title>
  <link rel="stylesheet" href="/style.css?v=4">
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
  <div class="top-bar">
    <div style="display: flex; align-items: center; gap: 8px;">
      <button id="backBtn" class="back-btn" onclick="backToFeed()">← Back</button>
      <div class="logo-box">⚡ Zingra</div>
    </div>
    <div style="background: #10b98122; color: #10b981; font-size: 11px; padding: 3px 8px; border-radius: 10px; font-weight: bold;">✨ Ad-Free</div>
  </div>

  <!-- 1. FEED -->
  <div id="feed-screen" class="screen active-screen">
    <div id="feedList" class="feed-container"></div>
  </div>

  <!-- 2. WATCH -->
  <div id="watch-screen" class="screen">
    <div class="video-sticky-box">
      <video id="watchVideoPlayer" controls autoplay playsinline></video>
    </div>
    <div class="watch-details">
      <div id="activeTitle" class="watch-title">Video Title</div>
      <div id="activeViews" class="watch-views">Views</div>
      <div class="actions-bar">
        <button id="likeBtn" class="act-pill" onclick="toggleActiveLike()">👍 <span id="activeLikeCount">24K</span></button>
        <button class="act-pill" onclick="switchTab('chat')" style="background:linear-gradient(90deg, #2563eb, #38bdf8); color:#000; font-weight:bold;">👥 Watch with Friend</button>
      </div>
    </div>
    <div class="related-section">
      <div class="related-title">▶ Up Next • Related Videos</div>
      <div id="relatedVideosList" class="related-list"></div>
    </div>
  </div>

  <!-- 3. CHAT -->
  <div id="chat-screen" class="screen">
    <div class="user-profile-bar">
      <div class="profile-top-row">
        <span class="my-username-tag">👤 You: <span id="myUsernameDisplay">@User</span></span>
        <span class="edit-name-btn" onclick="openAuthModal()">✏️ Change Name / PIN</span>
      </div>
      <button class="share-invite-btn" onclick="shareMyChatLink()">🔗 Share My Private Chat Link (WhatsApp)</button>
      <div class="connect-row">
        <input type="text" id="partnerInput" class="connect-input" placeholder="Dost ka Username (e.g. rahul)..." />
        <button class="connect-btn" onclick="connectToPartnerManual()">Chat</button>
      </div>
    </div>
    <div class="chat-partner-header">
      <span id="activePartnerText">🔒 Chatting with: None</span>
      <span style="color: #10b981; font-size: 11px;">● E2EE Active</span>
    </div>
    <div id="chatsContainer" class="chats-container"></div>
    <div class="chat-input-bar">
      <input type="text" id="msgInput" class="chat-input" placeholder="Secret message likho..." onkeypress="if(event.key === 'Enter') sendMsg()" />
      <button class="send-btn" onclick="sendMsg()">➤</button>
    </div>
  </div>

  <!-- POPUP: USERNAME & 4-DIGIT PIN MODAL -->
  <div id="authModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:999; align-items:center; justify-content:center; padding:20px;">
    <div style="background:#111827; border:1px solid #374151; padding:20px; border-radius:16px; width:100%; max-width:320px; display:flex; flex-direction:column; gap:12px;">
      <h3 style="font-size:16px; color:#38bdf8;">🔐 Username & PIN Lock</h3>
      <p style="font-size:12px; color:#9ca3af; line-height:1.4;">Ye PIN aapke username ko chori hone se bachata hai.</p>
      
      <input type="text" id="modalUsernameInput" placeholder="Naya Username (e.g. arjun)" style="background:#1f2937; border:1px solid #374151; color:#fff; padding:10px 14px; border-radius:8px; font-size:14px; outline:none;" />
      
      <input type="password" id="modalPinInput" maxlength="4" placeholder="4-Digit PIN (e.g. 9999)" style="background:#1f2937; border:1px solid #374151; color:#fff; padding:10px 14px; border-radius:8px; font-size:14px; outline:none;" />

      <div style="display:flex; gap:8px; margin-top:6px;">
        <button onclick="closeAuthModal()" style="flex:1; background:#374151; color:#fff; border:none; padding:10px; border-radius:8px; font-weight:bold; cursor:pointer;">Cancel</button>
        <button onclick="saveAuthModal()" style="flex:1; background:#2563eb; color:#fff; border:none; padding:10px; border-radius:8px; font-weight:bold; cursor:pointer;">Save & Lock</button>
      </div>
    </div>
  </div>

  <!-- NAV -->
  <div class="bottom-nav">
    <div id="nav-home" class="nav-item active" onclick="switchTab('feed')"><div>🏠</div><div>Home</div></div>
    <div id="nav-watch" class="nav-item" onclick="switchTab('watch')"><div>🎬</div><div>Watch</div></div>
    <div id="nav-chat" class="nav-item" onclick="switchTab('chat')"><div>💬</div><div>Chat</div></div>
  </div>

  <script src="/app.js?v=4"></script>
</body>
</html>
